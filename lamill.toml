[content]
# Declarative content identity for this site.
# Authored by the human; consumed by rankmill to generate drafts and run audits.
# Leave fields empty until you have a deliberate answer. Empty is better than wrong.
site_type = "b2b"
primary_keyword = "CMMC Microsoft 365 evidence checklist"
secondary_keywords = [
    "CMMC MFA evidence",
    "NIST 800-171 audit logging evidence",
    "CMMC software for MSPs",
]
icp = "The ideal customer is an MSP or compliance-focused MSSP managing 10+ defense contractor clients that need CMMC Level 1 or Level 2 readiness support. They already handle Microsoft 365, Entra, GCC/GCC High, MFA, access control, logging, and security policy configuration, but lose billable time manually collecting evidence for each client."
urgency_trigger = "Clients need CMMC/NIST readiness and MSPs are losing billable hours collecting evidence manually"
penalty = "Continued loss of billable time and delayed or incomplete CMMC/NIST readiness for defense contractor clients"
tone = "direct, technical, no fluff — credible and practitioner-to-practitioner"
law = "CMMC; NIST SP 800-171"
